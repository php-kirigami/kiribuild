# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/php-kirigami/kirigami@main/packages/kirigami/kirigami.schema.json

# Fixture project for .github/workflows/test.yml (the `cli-resolution` job).
# Deliberately depends on nothing but @kirigami/kirigami itself — no @kirigami/canva,
# no plugins, no Sass/esbuild tasks — so it installs and exports on any published
# kiri version. It still exercises the core feature surface: PHP layouts, a data
# file, a Markdown block, a custom tag + render hook, and the image autogenerator.

kirigami:
  project: KiriBuild Fixture
  baseurl: https://example.github.io/kiribuild-fixture
  root:    src

  tagline: Exported by KiriBuild.

image:
  format: webp
  source: assets
  dest:   images

prepros:
  before:   _layouts/header.php
  after:    _layouts/footer.php
  includes: [_lib/functions.php]
  format:   true
