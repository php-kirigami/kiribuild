name: 'KiriBuild'
description: 'Ensure Node 24+ and the Kirigami CLI are available, then run kiri export'
author: 'Maxime Larrivée-Roy'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  node-version:
    description: 'Node.js version to install if the runner does not already have Node 24+'
    required: false
    default: '24'
  kirigami-version:
    description: 'Version of @kirigami/kirigami to install when the project has no local copy'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Check for Node 24+
      id: node
      shell: bash
      run: |
        if command -v node >/dev/null 2>&1; then
          major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
        else
          major=0
        fi
        echo "Detected Node major version: ${major:-0}"
        if [ "${major:-0}" -ge 24 ]; then
          echo "satisfied=true" >> "$GITHUB_OUTPUT"
        else
          echo "satisfied=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node
      if: steps.node.outputs.satisfied != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install project dependencies
      if: ${{ hashFiles('package.json') != '' }}
      shell: bash
      run: |
        if [ -d node_modules ]; then
          echo "node_modules already present; skipping install."
        elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          echo "Lockfile present; using 'npm ci' (leaves the lockfile untouched)."
          npm ci
        else
          npm install
        fi

    - name: Ensure the Kirigami CLI is available
      shell: bash
      run: |
        if [ -x "./node_modules/.bin/kiri" ]; then
          echo "Using local @kirigami/kirigami from node_modules."
        else
          echo "No local Kirigami CLI found; installing @kirigami/kirigami@${{ inputs.kirigami-version }} globally."
          npm install -g "@kirigami/kirigami@${{ inputs.kirigami-version }}"
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
        fi

    - name: Export
      shell: bash
      run: |
        if [ -x "./node_modules/.bin/kiri" ]; then
          KIRI_BIN="./node_modules/.bin/kiri"
        else
          KIRI_BIN="$(which kiri)"
        fi
        echo "Running: $KIRI_BIN export"
        node --experimental-wasm-jspi "$KIRI_BIN" export
