name: 'KiriBuild'
description: 'Ensure Node 24+ and the Kirigami CLI are available, then run kiri export'
author: 'Maxime Larrivée-Roy'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  node-version:
    description: 'Node.js version to install if the runner does not already have Node 24+'
    required: false
    default: '24'
  cli-version:
    description: 'Version of @kirigami/cli to install globally when the project has no local kiri'
    required: false
    default: 'latest'
  kirigami-version:
    description: 'Legacy: install this @kirigami/kirigami version globally instead of @kirigami/cli (only versions before 3.0.0 ship kiri)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Check for Node 24+
      id: node
      shell: bash
      run: |
        if command -v node >/dev/null 2>&1; then
          major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
        else
          major=0
        fi
        echo "Detected Node major version: ${major:-0}"
        if [ "${major:-0}" -ge 24 ]; then
          echo "satisfied=true" >> "$GITHUB_OUTPUT"
        else
          echo "satisfied=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node
      if: steps.node.outputs.satisfied != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install project dependencies
      if: ${{ hashFiles('package.json') != '' }}
      shell: bash
      run: |
        if [ -d node_modules ]; then
          echo "node_modules already present; skipping install."
        elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
          echo "Lockfile present; using 'npm ci' (leaves the lockfile untouched)."
          npm ci
        else
          npm install
        fi

    - name: Ensure the Kirigami CLI is available
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
        KIRIGAMI_VERSION: ${{ inputs.kirigami-version }}
      run: |
        if [ -x "./node_modules/.bin/kiri" ]; then
          echo "Using the local kiri from node_modules."
        else
          if [ -n "$KIRIGAMI_VERSION" ]; then
            pkg="@kirigami/kirigami@$KIRIGAMI_VERSION"
          else
            pkg="@kirigami/cli@$CLI_VERSION"
            if [ -d node_modules/@kirigami/kirigami ]; then
              echo "::warning::The project depends on @kirigami/kirigami but not on @kirigami/cli; the global kiri uses its own engine version. Add @kirigami/cli to devDependencies to pin it."
            fi
          fi
          echo "No local kiri found; installing $pkg globally."
          npm install -g "$pkg"
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"
        fi

    - name: Export
      shell: bash
      run: |
        if [ -x "./node_modules/.bin/kiri" ]; then
          KIRI_BIN="./node_modules/.bin/kiri"
        else
          KIRI_BIN="$(which kiri)"
        fi
        # Node 24 needs the JSPI flag; newer Node ships JSPI enabled and rejects it.
        if node --experimental-wasm-jspi -e 0 >/dev/null 2>&1; then
          NODE_FLAGS="--experimental-wasm-jspi"
        else
          NODE_FLAGS=""
        fi
        echo "Running: node $NODE_FLAGS $KIRI_BIN export"
        node $NODE_FLAGS "$KIRI_BIN" export
