name: 'KiriBuild'
description: 'Checkout, setup Node, install Kirigami CLI (local or global), and export'
author: 'Maxime Larrivée-Roy'

branding:
  icon: 'package'
  color: 'purple'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  kirigami-version:
    description: 'Version of @kirigami/kirigami to install globally (fallback)'
    required: false
    default: 'latest'
  lfs:
    description: 'Whether to checkout with Git LFS'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: ${{ inputs.lfs }}

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install project dependencies
      if: ${{ hashFiles('package.json') != '' }}
      run: npm install
      shell: bash

    - name: Install Kirigami CLI
      if: ${{ hashFiles('node_modules/.bin/kiri') == '' }}
      run: npm install @kirigami/kirigami@${{ inputs.kirigami-version }}
      shell: bash

    - name: Build and Export
      run: node --experimental-wasm-jspi ./node_modules/.bin/kiri export
      shell: bash