name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

# Newest @kirigami/kirigami known to install + export cleanly. `latest` has a
# history of shipping broken (1.2.0 bin, 1.3.0 schema, 1.3.2 briefly missing a
# published dep), so the gating jobs pin this while the non-blocking
# `latest-canary` scenario tracks `latest`. When the canary is green and stays
# green, bump this line (or drop the pinning entirely).
env:
  KIRI_GOOD: "1.3.2"

jobs:
  # ---------------------------------------------------------------------------
  # Plumbing + core-feature test: a tiny fixture (test/fixtures/site) that
  # depends only on @kirigami/kirigami, run through every CLI-resolution branch
  # of the action. Each full run also asserts the core Kirigami feature surface:
  # PHP layouts, a data file, a Markdown block, a custom tag + render hook and
  # the image autogenerator.
  # ---------------------------------------------------------------------------
  cli-resolution:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.scenario == 'latest-canary' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # package.json keeps @kirigami/kirigami → the action installs deps and
          # uses ./node_modules/.bin/kiri
          - scenario: local-cli
          # dependency stripped → the action falls back to `npm install -g`
          - scenario: global-cli
          # deps already installed by the workflow → the action must NOT reinstall
          - scenario: preinstalled
          # a committed package-lock.json → the action must use `npm ci`
          - scenario: lockfile
          # Node 24 already on PATH → the action must skip its own setup-node
          - scenario: has-node-24
          # an explicit, non-latest kirigami-version must be the one installed
          - scenario: pinned-version
          # non-blocking: does the action still work against the current `latest`?
          - scenario: latest-canary

    steps:
      - name: Check out the action
        uses: actions/checkout@v7
        with:
          path: .action

      - name: Set up Node 24 ahead of the action
        if: matrix.scenario == 'has-node-24'
        uses: actions/setup-node@v7
        with:
          node-version: 24.0.0

      - name: Stage the fixture at the workspace root
        shell: bash
        run: |
          cp -R .action/test/fixtures/site/. .
          # Pin the local dependency to the known-good version (fixture ships "latest").
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.devDependencies['@kirigami/kirigami']=process.env.KIRI_GOOD;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          case "${{ matrix.scenario }}" in
            global-cli|has-node-24|pinned-version|latest-canary)
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.devDependencies;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
              ;;
            preinstalled)
              npm install
              : > node_modules/.kiribuild-sentinel
              ;;
            lockfile)
              # write package-lock.json but no node_modules, so the action's
              # install step runs and must pick `npm ci`
              npm install --package-lock-only
              ;;
          esac

      - name: Run KiriBuild
        uses: ./.action
        with:
          kirigami-version: ${{ (matrix.scenario == 'pinned-version' && '1.1.2') || (matrix.scenario == 'latest-canary' && 'latest') || env.KIRI_GOOD }}

      - name: Assert the fixture was exported, with every core feature
        # pinned-version / latest-canary install a different CLI on purpose —
        # they get lighter checks below.
        if: matrix.scenario != 'pinned-version' && matrix.scenario != 'latest-canary'
        shell: bash
        run: |
          fail() { echo "::error::$1"; exit 1; }
          html=dist/index.html

          # PHP layouts + page data
          [ -f "$html" ]                               || fail "dist/index.html is missing"
          [ -f dist/about/index.html ]                 || fail "dist/about/index.html is missing"
          grep -q 'KiriBuild Fixture' "$html"          || fail "project data was not rendered"

          # render hook (post_render token swap)
          grep -q 'Built by KiriBuild' "$html"         || fail "post_render hook did not run"
          ! grep -q '{{built-by}}' "$html"             || fail "post_render token left unreplaced"

          # custom tag
          grep -q 'class="up">GENERATED' "$html"       || fail "custom <uppercase> tag did not render"

          # data file (@stats _stats.json)
          grep -q 'Runtime dependencies' "$html"       || fail "JSON data file was not looped over"

          # Markdown block
          grep -q 'A list item' "$html"                || fail "<markdown> block was not converted"
          ! grep -q '<markdown>' "$html"               || fail "<markdown> tag left in output"

          # image autogenerator
          ls dist/images/*.webp >/dev/null 2>&1        || fail "image autogenerator produced no webp"

          # sitemap + no leaked partials
          [ -f dist/sitemap.xml ]                      || fail "sitemap.xml not generated"
          ! find dist -name '_*' | grep -q .           || fail "partial source files leaked into dist/"

          echo "Exported $(find dist -type f | wc -l) files:"
          find dist -type f | sort

      - name: Assert the local CLI was used
        if: matrix.scenario == 'local-cli' || matrix.scenario == 'preinstalled' || matrix.scenario == 'lockfile'
        shell: bash
        run: test -x ./node_modules/.bin/kiri || { echo "::error::local kiri missing"; exit 1; }

      - name: Assert the committed lockfile was used ('npm ci')
        if: matrix.scenario == 'lockfile'
        shell: bash
        run: |
          [ -d node_modules ]       || { echo "::error::install step did not run"; exit 1; }
          [ -f package-lock.json ]  || { echo "::error::lockfile vanished"; exit 1; }
          # npm ci refuses a lockfile that's out of sync with package.json, so a
          # clean export here is itself proof the ci path ran.
          [ -f dist/index.html ]    || { echo "::error::no export"; exit 1; }

      - name: Assert existing dependencies were not reinstalled
        if: matrix.scenario == 'preinstalled'
        shell: bash
        run: test -f node_modules/.kiribuild-sentinel || { echo "::error::node_modules was rebuilt"; exit 1; }

      - name: Assert the global CLI fallback was used
        if: matrix.scenario == 'global-cli' || matrix.scenario == 'has-node-24' || matrix.scenario == 'pinned-version' || matrix.scenario == 'latest-canary'
        shell: bash
        run: |
          command -v kiri >/dev/null || { echo "::error::global kiri not on PATH"; exit 1; }
          [ ! -e ./node_modules/.bin/kiri ] || { echo "::error::unexpected local kiri"; exit 1; }

      - name: Assert the pinned kirigami-version was installed and exported
        if: matrix.scenario == 'pinned-version'
        shell: bash
        run: |
          npm ls -g @kirigami/kirigami --depth=0 | grep -q '@1.1.2' \
            || { echo "::error::pinned version not honoured"; exit 1; }
          [ -f dist/index.html ] || { echo "::error::pinned CLI produced no output"; exit 1; }
          grep -q 'KiriBuild Fixture' dist/index.html \
            || { echo "::error::pinned CLI did not render the page"; exit 1; }

      - name: Canary — does the action still work against the latest CLI?
        if: matrix.scenario == 'latest-canary'
        shell: bash
        run: |
          if [ ! -f dist/index.html ] || ! grep -q 'KiriBuild Fixture' dist/index.html; then
            echo '::error::latest @kirigami/kirigami produced no usable export — still broken upstream'
            exit 1
          fi
          echo 'latest @kirigami/kirigami works — bump KIRI_GOOD in this workflow and unpin.'

      - name: Assert the pre-installed Node was kept (setup-node skipped)
        if: matrix.scenario == 'has-node-24'
        shell: bash
        run: |
          v="$(node -v)"
          [ "$v" = "v24.0.0" ] || { echo "::error::expected v24.0.0, action re-ran setup-node and got $v"; exit 1; }

  # ---------------------------------------------------------------------------
  # Real-world test: run the action against the official Kirigami templates,
  # which pull in the parts the fixture can't (@kirigami/canva + Sass, esbuild,
  # the highlight plugin). The staged package.json is pinned to KIRI_GOOD.
  # ---------------------------------------------------------------------------
  templates:
    name: templates (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [template-default, template-demo]

    steps:
      - name: Check out the action
        uses: actions/checkout@v7
        with:
          path: .action

      - name: Check out ${{ matrix.template }}
        uses: actions/checkout@v7
        with:
          repository: php-kirigami/${{ matrix.template }}
          path: .template

      - name: Stage the template at the workspace root
        shell: bash
        run: |
          rsync -a --exclude .git .template/ ./
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.devDependencies['@kirigami/kirigami']=process.env.KIRI_GOOD;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          # the KIRI_GOOD pin above desyncs any committed lockfile — drop it so
          # the action installs fresh (its `npm ci` branch is covered by the
          # cli-resolution 'lockfile' scenario instead)
          rm -f package-lock.json npm-shrinkwrap.json

      - name: Run KiriBuild
        uses: ./.action

      - name: Assert the template exported (common)
        shell: bash
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f dist/index.html ]                    || fail "home page not exported"
          [ -f dist/about/index.html ]              || fail "about page not exported"
          [ -f dist/sitemap.xml ]                   || fail "sitemap.xml not generated"
          ls dist/styles/*.css >/dev/null 2>&1      || fail "Sass task (@kirigami/canva) produced no CSS"
          ls dist/scripts/*.js  >/dev/null 2>&1     || fail "esbuild task produced no JS"
          if find dist -name '_*' | grep -q .; then
            find dist -name '_*'; fail "partial source files leaked into dist/"
          fi
          echo "Exported $(find dist -type f | wc -l) files."

      - name: Assert the demo's showcase features (template-demo)
        if: matrix.template == 'template-demo'
        shell: bash
        run: |
          fail() { echo "::error::$1"; exit 1; }
          for p in markdown images code data tags; do
            [ -f "dist/features/$p/index.html" ] || fail "features/$p page not exported"
          done
          ls dist/images/*.webp >/dev/null 2>&1                          || fail "image autogenerator produced no images"
          grep -q 'class="swatches"' dist/features/images/index.html     || fail "custom <swatches> tag not rendered"
          grep -q 'hljs' dist/features/code/index.html                   || fail "highlight plugin did not run"
          grep -q 'stat__num' dist/features/data/index.html              || fail "JSON data file was not looped over"
          grep -q 'article__meta' dist/features/data/index.html          || fail "YAML data file was not looped over"
