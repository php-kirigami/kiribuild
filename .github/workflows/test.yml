name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Real-world test: run the action against php-kirigami/template-demo, the
  # project that exercises the whole Kirigami feature set including the parts
  # that need extra packages (@kirigami/canva, @kirigami/plugin-highlight,
  # Sass, esbuild).
  #
  # Manual-only for now: template-demo pins @kirigami/canva ^2 and
  # @kirigami/plugin-highlight, which aren't on npm yet, so a clean `npm
  # install` fails. Flip this to `push` once the ecosystem is published.
  # ---------------------------------------------------------------------------
  features:
    name: features (template-demo)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the action
        uses: actions/checkout@v7
        with:
          path: .action

      - name: Check out the Kirigami demo project
        uses: actions/checkout@v7
        with:
          repository: php-kirigami/template-demo
          path: .demo

      - name: Stage the demo project at the workspace root
        shell: bash
        run: rsync -a --exclude .git .demo/ ./

      - name: Run KiriBuild
        uses: ./.action

      - name: Assert every Kirigami feature produced output
        shell: bash
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [ -f dist/index.html ]                              || fail "home page not exported"
          [ -f dist/features/markdown/index.html ]            || fail "markdown page not exported"
          [ -f dist/features/data/index.html ]                || fail "data-files page not exported"
          [ -f dist/features/images/index.html ]              || fail "images page not exported"
          [ -f dist/features/code/index.html ]                || fail "code page not exported"
          [ -f dist/features/tags/index.html ]                || fail "tags & hooks page not exported"

          [ -f dist/sitemap.xml ]                             || fail "sitemap.xml not generated"
          ls dist/styles/*.css >/dev/null 2>&1                || fail "Sass task produced no CSS"
          ls dist/scripts/*.js >/dev/null 2>&1                || fail "esbuild task produced no JS"

          ls dist/images/*.webp >/dev/null 2>&1               || fail "image autogenerator produced no images"
          grep -q 'srcset' dist/features/images/index.html    || fail "responsive <img asset> not rendered"
          grep -q 'class="swatches"' dist/features/images/index.html \
                                                              || fail "custom <swatches> tag not rendered"
          grep -q 'hljs' dist/features/code/index.html        || fail "highlight plugin did not bake in styles"
          grep -q 'stat__num' dist/features/data/index.html   || fail "JSON data file was not looped over"
          grep -q 'article__meta' dist/features/data/index.html \
                                                              || fail "YAML data file was not looped over"

          if find dist -name '_*' | grep -q .; then
            find dist -name '_*'; fail "partial source files leaked into dist/"
          fi

          echo "Exported $(find dist -type f | wc -l) files."

  # ---------------------------------------------------------------------------
  # Plumbing + core-feature test: a tiny fixture (test/fixtures/site) that
  # depends only on @kirigami/kirigami, run through every CLI-resolution branch
  # of the action. Each run also asserts the core Kirigami feature surface:
  # PHP layouts, a data file, a Markdown block, a custom tag + render hook and
  # the image autogenerator.
  # ---------------------------------------------------------------------------
  cli-resolution:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # package.json keeps @kirigami/kirigami → the action installs deps and
          # uses ./node_modules/.bin/kiri
          - scenario: local-cli
          # dependency stripped → the action falls back to `npm install -g`
          - scenario: global-cli
          # deps already installed by the workflow → the action must NOT reinstall
          - scenario: preinstalled
          # Node 24 already on PATH → the action must skip its own setup-node
          - scenario: has-node-24
          # an explicit kirigami-version must be the one installed globally
          - scenario: pinned-version

    steps:
      - name: Check out the action
        uses: actions/checkout@v7
        with:
          path: .action

      - name: Set up Node 24 ahead of the action
        if: matrix.scenario == 'has-node-24'
        uses: actions/setup-node@v7
        with:
          node-version: 24.0.0

      - name: Stage the fixture at the workspace root
        shell: bash
        run: |
          cp -R .action/test/fixtures/site/. .
          case "${{ matrix.scenario }}" in
            global-cli|has-node-24|pinned-version)
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.devDependencies;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
              ;;
            preinstalled)
              npm install
              : > node_modules/.kiribuild-sentinel
              ;;
          esac

      - name: Run KiriBuild
        uses: ./.action
        with:
          kirigami-version: ${{ matrix.scenario == 'pinned-version' && '1.1.2' || 'latest' }}

      - name: Assert the fixture was exported, with every core feature
        # pinned-version deliberately installs an old CLI to prove the input is
        # honoured — don't assert current feature behaviour against it.
        if: matrix.scenario != 'pinned-version'
        shell: bash
        run: |
          fail() { echo "::error::$1"; exit 1; }
          html=dist/index.html

          # PHP layouts + page data
          [ -f "$html" ]                               || fail "dist/index.html is missing"
          [ -f dist/about/index.html ]                 || fail "dist/about/index.html is missing"
          grep -q 'KiriBuild Fixture' "$html"          || fail "project data was not rendered"

          # render hook (post_render token swap)
          grep -q 'Built by KiriBuild' "$html"         || fail "post_render hook did not run"
          ! grep -q '{{built-by}}' "$html"             || fail "post_render token left unreplaced"

          # custom tag
          grep -q 'class="up">GENERATED' "$html"       || fail "custom <uppercase> tag did not render"

          # data file (@stats _stats.json)
          grep -q 'Runtime dependencies' "$html"       || fail "JSON data file was not looped over"

          # Markdown block
          grep -q 'A list item' "$html"                || fail "<markdown> block was not converted"
          ! grep -q '<markdown>' "$html"               || fail "<markdown> tag left in output"

          # image autogenerator
          ls dist/images/*.webp >/dev/null 2>&1        || fail "image autogenerator produced no webp"

          # sitemap + no leaked partials
          [ -f dist/sitemap.xml ]                      || fail "sitemap.xml not generated"
          ! find dist -name '_*' | grep -q .           || fail "partial source files leaked into dist/"

          echo "Exported $(find dist -type f | wc -l) files:"
          find dist -type f | sort

      - name: Assert the local CLI was used
        if: matrix.scenario == 'local-cli' || matrix.scenario == 'preinstalled'
        shell: bash
        run: test -x ./node_modules/.bin/kiri || { echo "::error::local kiri missing"; exit 1; }

      - name: Assert existing dependencies were not reinstalled
        if: matrix.scenario == 'preinstalled'
        shell: bash
        run: test -f node_modules/.kiribuild-sentinel || { echo "::error::node_modules was rebuilt"; exit 1; }

      - name: Assert the global CLI fallback was used
        if: matrix.scenario == 'global-cli' || matrix.scenario == 'has-node-24' || matrix.scenario == 'pinned-version'
        shell: bash
        run: |
          command -v kiri >/dev/null || { echo "::error::global kiri not on PATH"; exit 1; }
          [ ! -e ./node_modules/.bin/kiri ] || { echo "::error::unexpected local kiri"; exit 1; }

      - name: Assert the pinned kirigami-version was installed and exported
        if: matrix.scenario == 'pinned-version'
        shell: bash
        run: |
          npm ls -g @kirigami/kirigami --depth=0 | grep -q '@1.1.2' \
            || { echo "::error::pinned version not honoured"; exit 1; }
          [ -f dist/index.html ] || { echo "::error::pinned CLI produced no output"; exit 1; }
          grep -q 'KiriBuild Fixture' dist/index.html \
            || { echo "::error::pinned CLI did not render the page"; exit 1; }

      - name: Assert the pre-installed Node was kept (setup-node skipped)
        if: matrix.scenario == 'has-node-24'
        shell: bash
        run: |
          v="$(node -v)"
          [ "$v" = "v24.0.0" ] || { echo "::error::expected v24.0.0, action re-ran setup-node and got $v"; exit 1; }
