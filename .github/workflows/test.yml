name: Test KiriBuild

on:
  push:
  workflow_dispatch:

jobs:
  test-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Kirigami CLI (global)
        run: npm install -g @kirigami/kirigami@latest

      - name: Verify kiri is available
        run: |
          node --experimental-wasm-jspi "$(which kiri)" --version